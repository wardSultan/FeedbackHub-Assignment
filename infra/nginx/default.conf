server {
    # 8080 rather than 80 so the container needs no privileged port and can run
    # as a non-root user under a restrictive pod security context.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed build artefacts are immutable; index.html and the runtime config are
    # not, and caching either is how a deploy fails to reach anyone.
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /config.json { add_header Cache-Control "no-store"; }

    # Single-page application: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
