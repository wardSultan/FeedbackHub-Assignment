# Placeholders. base64 in a manifest is encoding, not encryption — anyone who can
# read this file can read these values, which is why this one holds only local
# development credentials and is committed as a template.
#
# In production this manifest would not exist: the values would come from External
# Secrets or SOPS, so the repository never contains the real ones. Stated here
# rather than implied, because a committed Secret that looks production-shaped is
# worse than an obviously fake one.
apiVersion: v1
kind: Secret
metadata:
  name: feedbackhub-secrets
  namespace: feedbackhub
type: Opaque
stringData:
  POSTGRES_PASSWORD: "feedbackhub"
  KEYCLOAK_DB_PASSWORD: "keycloak"
  KEYCLOAK_ADMIN_PASSWORD: "admin"
  DATABASE_URL: "postgresql://feedbackhub:feedbackhub@postgres:5432/feedbackhub"
