apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: feedbackhub

resources:
  - namespace.yaml
  - config.yaml
  - secret.yaml
  - postgres.yaml
  - keycloak.yaml
  - migrate-job.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml

# Generated rather than hand-written, so the realm and the database bootstrap script
# have exactly one copy each — the same files Docker Compose mounts.
configMapGenerator:
  - name: keycloak-realm
    files:
      - realm-feedbackhub.json=../../keycloak/realm-feedbackhub.json
  - name: postgres-init
    files:
      - 10-keycloak-db.sh=../../postgres/init-keycloak-db.sh

generatorOptions:
  disableNameSuffixHash: true

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: feedbackhub
