apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: feedbackhub
  labels:
    app.kubernetes.io/name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: feedbackhub
  labels:
    app.kubernetes.io/name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: web
          image: feedbackhub/web:0.1.0
          ports:
            - name: http
              containerPort: 8080
          # The same image in every environment. These three variables are what the
          # entrypoint turns into /config.json at start-up, which is why there is no
          # per-environment build.
          env:
            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: feedbackhub-config
                  key: API_URL
            - name: KEYCLOAK_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: feedbackhub-config
                  key: KEYCLOAK_ISSUER
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: feedbackhub-config
                  key: KEYCLOAK_CLIENT_ID
          livenessProbe:
            httpGet: { path: /index.html, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /config.json, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          # nginx writes its temp files and the generated config.json, so the root
          # filesystem cannot be read-only here without mounting several emptyDirs —
          # a trade recorded rather than silently taken.
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
