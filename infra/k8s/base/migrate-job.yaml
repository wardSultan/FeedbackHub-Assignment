# Migrations run once per release, not once per replica.
#
# Two API pods starting together would both run `prisma migrate deploy` against the
# same database. A Job makes it a single execution with a defined completion, and the
# API's readiness probe keeps traffic away until it has finished.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: feedbackhub
  labels:
    app.kubernetes.io/name: migrate
spec:
  backoffLimit: 3
  # Kept briefly after success so the logs are readable when a deploy is investigated.
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: migrate
          image: feedbackhub/api:0.1.0
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: feedbackhub-secrets
                  key: DATABASE_URL
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
