# Local development stack.
#
#   cp .env.example .env && docker compose up -d
#
# Brings up PostgreSQL, Keycloak with the realm imported, the API, and the web
# application. Migrations run as a one-shot service so two API replicas can never race
# each other applying the same migration.
#
# Keycloak takes 30-60 seconds to become ready on a cold start. The healthcheck below is
# what makes `depends_on: service_healthy` meaningful rather than decorative.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feedbackhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feedbackhub}
      POSTGRES_DB: ${POSTGRES_DB:-feedbackhub}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/10-keycloak-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-feedbackhub} -d ${POSTGRES_DB:-feedbackhub}']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.0
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '${KEYCLOAK_PORT:-8080}:8080'
    volumes:
      - ./infra/keycloak/realm-feedbackhub.json:/opt/keycloak/data/import/realm-feedbackhub.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The management port serves the health endpoints from Keycloak 25 onwards, and the
      # image ships no curl or wget — hence talking HTTP over bash's /dev/tcp.
      #
      # The line endings are not incidental: HTTP requires CRLF, and the widely copied
      # `echo -e "...\n..."` form of this healthcheck gets a 400 back, never turns
      # healthy, and hangs `depends_on: service_healthy` indefinitely. Verified against a
      # real Keycloak 26.5 before being committed.
      #
      # `bash` is named explicitly rather than relying on CMD-SHELL, because /dev/tcp is a
      # bash builtin and CMD-SHELL runs /bin/sh.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | grep -q '"status": "UP"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-feedbackhub}:${POSTGRES_PASSWORD:-feedbackhub}@postgres:5432/${POSTGRES_DB:-feedbackhub}
    depends_on:
      postgres:
        condition: service_healthy
    # Runs to completion and exits; the API waits for that rather than for a healthcheck.
    restart: 'no'

  api:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-feedbackhub}:${POSTGRES_PASSWORD:-feedbackhub}@postgres:5432/${POSTGRES_DB:-feedbackhub}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-4200}
      # The issuer must be the URL the *browser* used, because that is what ends up in
      # the token's iss claim — not the in-container hostname.
      KEYCLOAK_ISSUER_URL: http://localhost:${KEYCLOAK_PORT:-8080}/realms/feedbackhub
      KEYCLOAK_AUDIENCE: feedbackhub-api
      BOOTSTRAP_ADMIN_EMAIL: admin@feedbackhub.local
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    environment:
      API_URL: http://localhost:${API_PORT:-3000}
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/feedbackhub
      KEYCLOAK_CLIENT_ID: feedbackhub-web
    ports:
      - '${WEB_PORT:-4200}:8080'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
